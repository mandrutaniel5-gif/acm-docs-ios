<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><title>ACM Docs Control</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;color:#16181d;font:15px/1.5 "Segoe UI",Roboto,Arial,sans-serif}
.c{max-width:420px;background:#fff;border:1px solid #e3e5ea;border-radius:14px;padding:28px;text-align:center}
h1{font-size:19px;margin:0 0 8px}p{color:#6b7080;margin:0 0 6px}kbd{background:#f0f1f4;border-radius:6px;padding:2px 7px;font:13px Consolas,monospace}
@media (prefers-color-scheme:dark){body{background:#0e1015;color:#e8e9ee}.c{background:#171a21;border-color:#262a34}p{color:#9096a6}kbd{background:#1d212a}}
</style></head>
<body><div class="c"><h1>Panoul nu poate fi încărcat</h1><p>Verifică conexiunea la internet.</p><p>Apasă <kbd>F5</kbd> ca să încerci din nou.</p></div></body></html>
