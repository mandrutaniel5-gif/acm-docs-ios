// ACM Docs for Android, built by Gradle (node build/build-android.mjs prepares the web app and runs it).
// The sources stay where they were: AndroidManifest.xml, src/, res/; the web app comes from ACM_ASSETS.
plugins {
    id 'com.android.application' version '9.1.0'
}

android {
    namespace = 'ro.acmcode.docs'
    compileSdk = 36

    defaultConfig {
        applicationId = 'ro.acmcode.docs'
        // Firebase Cloud Messaging (the notifications) needs Android 6 or newer
        minSdk = 23
        targetSdk = 34
        versionCode = (System.getenv('ACM_CODE') ?: '1') as int
        versionName = System.getenv('ACM_VERSION') ?: '0.0.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.directories.add('src')
            res.directories.add('res')
            assets.directories.add(System.getenv('ACM_ASSETS') ?: 'assets')
        }
    }

    signingConfigs {
        release {
            if (System.getenv('ACM_KS')) {
                storeFile = file(System.getenv('ACM_KS'))
                storePassword = System.getenv('ACM_KS_PW')
                keyAlias = 'acmdocs'
                keyPassword = System.getenv('ACM_KS_PW')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = System.getenv('ACM_KS') ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
