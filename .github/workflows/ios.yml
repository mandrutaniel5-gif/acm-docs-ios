name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (simulator)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project ACMDocs.xcodeproj -scheme ACMDocs -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-sim.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-sim.log

      - name: Run in the simulator (self-test + screenshots)
        run: |
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/ACMDocs.app
          xcrun simctl spawn "$UDID" log stream --style compact --level debug --predicate 'process == "ACMDocs"' > shots/app-log.txt 2>&1 &
          LOGPID=$!
          xcrun simctl launch --console-pty "$UDID" ro.acmcode.docs -selftest > shots/console.txt 2>&1 &
          sleep 12
          xcrun simctl spawn "$UDID" launchctl list | grep -i acm > shots/running.txt 2>&1 || echo "NOT RUNNING" > shots/running.txt
          xcrun simctl io "$UDID" screenshot shots/1-home.png
          C=$(xcrun simctl get_app_container "$UDID" ro.acmcode.docs data)
          for i in $(seq 1 60); do [ -f "$C/Documents/selftest.json" ] && break; sleep 2; done
          echo "=== self-test ==="; cat "$C/Documents/selftest.json" || echo "no self-test result"
          cp "$C/Documents/selftest.json" shots/ || true
          sleep 6;  xcrun simctl io "$UDID" screenshot shots/2-settings.png
          sleep 8;  xcrun simctl io "$UDID" screenshot shots/3-invoice.png
          sleep 8;  xcrun simctl io "$UDID" screenshot shots/4-files.png
          kill $LOGPID 2>/dev/null || true
          mkdir -p shots/crash
          cp ~/Library/Logs/DiagnosticReports/ACMDocs* shots/crash/ 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -newer ios/project.yml -name '*.ips' -exec cp {} shots/crash/ \; 2>/dev/null || true
          ls -la shots shots/crash

      - name: Build for iPhone (unsigned .ipa)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project ACMDocs.xcodeproj -scheme ACMDocs -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build-dev.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-dev.log
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/ACMDocs.app Payload/
          zip -qr ../ACM-Docs-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-result
          path: |
            shots/
            ACM-Docs-unsigned.ipa
            ios/build-sim.log
            ios/build-dev.log

      # the same results on the "ios-build" branch (readable with plain git, no artifact download needed)
      - name: Publish results to the ios-build branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -R shots /tmp/out/ 2>/dev/null || true
          cp ACM-Docs-unsigned.ipa ios/build-sim.log ios/build-dev.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b ios-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "iOS build ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ios-build
