name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      # Xcode 26 = iOS 26 SDK (needed for Liquid Glass); the app still runs from iOS 15
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version | tee xcode-version.txt
          xcrun simctl list runtimes | tee runtimes.txt

      - name: Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (simulator)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project ACMDocs.xcodeproj -scheme ACMDocs -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-sim.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-sim.log

      - name: Run in the simulator (self-test + screenshots)
        run: |
          mkdir -p shots
          for f in ios/build/Build/Products/Debug-iphonesimulator/ACMDocs.app/ACMDocs*; do echo "== $f"; otool -L "$f"; done > shots/linked-libs.txt 2>&1 || true
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; import re; rs=sorted([(tuple(int(n) for n in re.findall(r'iOS-(\\d+)-(\\d+)', k)[0]), v) for k,v in d.items() if re.search(r'iOS-\\d+-\\d+', k)], reverse=True); print(next(x['udid'] for _,v in rs for x in v if x['name'].startswith('iPhone')))")
          echo "simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/ACMDocs.app
          xcrun simctl spawn "$UDID" log stream --style compact --level debug --predicate 'process == "ACMDocs"' > shots/app-log.txt 2>&1 &
          LOGPID=$!
          xcrun simctl launch --console-pty "$UDID" ro.acmcode.docs -selftest > shots/console.txt 2>&1 &
          sleep 12
          xcrun simctl spawn "$UDID" launchctl list | grep -i acm > shots/running.txt 2>&1 || echo "NOT RUNNING" > shots/running.txt
          xcrun simctl io "$UDID" screenshot shots/1-home.png
          C=$(xcrun simctl get_app_container "$UDID" ro.acmcode.docs data)
          for i in $(seq 1 60); do [ -f "$C/Documents/selftest.json" ] && break; sleep 2; done
          echo "=== self-test ==="; cat "$C/Documents/selftest.json" || echo "no self-test result"
          cp "$C/Documents/selftest.json" shots/ || true
          sleep 6;  xcrun simctl io "$UDID" screenshot shots/2-settings.png
          sleep 8;  xcrun simctl io "$UDID" screenshot shots/3-invoice.png
          sleep 8;  xcrun simctl io "$UDID" screenshot shots/4-files.png
          kill $LOGPID 2>/dev/null || true
          mkdir -p shots/crash
          cp ~/Library/Logs/DiagnosticReports/ACMDocs* shots/crash/ 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -newer ios/project.yml -name '*.ips' -exec cp {} shots/crash/ \; 2>/dev/null || true
          ls -la shots shots/crash

      # Real taps on several screens: small iPhone (SE), normal, Pro Max, iPad, and iOS 18 (no glass)
      - name: UI tests (several devices)
        if: always()
        run: |
          set +e
          cd ios
          xcodebuild build-for-testing -project ACMDocs.xcodeproj -scheme ACMDocs -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ui CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../uitest-build.log | grep -E "error:|\*\* TEST BUILD" 
          cd ..
          mkdir -p uishots
          python3 - > devices.txt <<'PY'
          import json, subprocess, re
          rts = [r for r in json.loads(subprocess.check_output(["xcrun","simctl","list","runtimes","-j"]))["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rts.sort(key=lambda r: [int(n) for n in r["version"].split(".")])
          new = rts[-1]
          old = [r for r in rts if r["version"].startswith("18")]
          names = {t["name"]: t["identifier"] for t in new.get("supportedDeviceTypes", [])}
          def pick(pattern):
              c = sorted([n for n in names if re.search(pattern, n)])
              return c[-1] if c else None
          want = [("se", pick(r"^iPhone SE")), ("iphone", pick(r"^iPhone \d+$")), ("promax", pick(r"Pro Max$")), ("ipad", pick(r"^iPad Air 11") or pick(r"^iPad \(") or pick(r"^iPad"))]
          for tag, n in want:
              if n: print(tag, names[n], new["identifier"], n.replace(" ", "_"))
          if old:
              o = old[-1]; on = {t["name"]: t["identifier"] for t in o.get("supportedDeviceTypes", [])}
              n = sorted([x for x in on if re.search(r"^iPhone \d+$", x)])
              if n: print("ios18", on[n[-1]], o["identifier"], n[-1].replace(" ", "_"))
          PY
          cat devices.txt
          : > uitests-summary.txt
          while read TAG TYPE RT NAME; do
            UDID=$(xcrun simctl create "ui-$TAG" "$TYPE" "$RT") || { echo "$TAG: cannot create $NAME" >> uitests-summary.txt; continue; }
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b >/dev/null
            echo "=== $TAG ($NAME, $RT)" >> uitests-summary.txt
            TEST_RUNNER_SHOTS_DIR="$PWD/uishots" TEST_RUNNER_DEVICE_TAG="$TAG" \
              xcodebuild test-without-building -project ios/ACMDocs.xcodeproj -scheme ACMDocs -destination "id=$UDID" \
              -derivedDataPath ios/build-ui CODE_SIGNING_ALLOWED=NO > "uitest-$TAG.log" 2>&1
            grep -E "Test Case .*(passed|failed|skipped)|error: |XCTAssert|Skipped|\*\* TEST" "uitest-$TAG.log" | grep -v "^\s*$" >> uitests-summary.txt
            xcrun simctl shutdown "$UDID"
          done < devices.txt
          cat uitests-summary.txt
          ls uishots | head -100

      - name: Build for iPhone (unsigned .ipa)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project ACMDocs.xcodeproj -scheme ACMDocs -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build-dev.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-dev.log
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/ACMDocs.app Payload/
          # ad-hoc signature: Sideloadly / AltStore re-sign it with the user's Apple ID
          # (a binary with no signature at all fails on the phone: "No code signature found")
          codesign --force --sign - --timestamp=none Payload/ACMDocs.app
          codesign -dv Payload/ACMDocs.app 2>&1 | tee ../codesign.txt
          zip -qr ../ACM-Docs-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-result
          path: |
            shots/
            ACM-Docs-unsigned.ipa
            ios/build-sim.log
            ios/build-dev.log

      # the same results on the "ios-build" branch (readable with plain git, no artifact download needed)
      - name: Publish results to the ios-build branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -R shots uishots /tmp/out/ 2>/dev/null || true
          cp uitests-summary.txt devices.txt uitest-*.log /tmp/out/ 2>/dev/null || true
          cp ACM-Docs-unsigned.ipa codesign.txt xcode-version.txt runtimes.txt ios/build-sim.log ios/build-dev.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b ios-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "iOS build ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ios-build
