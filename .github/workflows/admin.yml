name: Admin

# Owner tools, run by hand from GitHub:
#   grant         gives an account a plan without payment (also possible from the control panel)
#   make-admin    makes an email the control panel's administrator (the account must exist first)
#   remove-admin  takes the administrator right away
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [grant, make-admin, remove-admin]
        default: grant
      handle: { description: "@name or email (grant) · administrator email (make-admin / remove-admin)", required: true, type: string }
      plan:
        description: "Plan (grant)"
        type: choice
        options: [pro, personal, basic]
        default: pro
      days: { description: "For how many days (grant; 0 = take it away)", type: number, default: 365 }

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Run
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ACTION: ${{ inputs.action }}
          HANDLE: ${{ inputs.handle }}
          PLAN: ${{ inputs.plan }}
          DAYS: ${{ inputs.days }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cd functions && npm ci --no-audit --no-fund >/dev/null
          case "$ACTION" in
            grant) node tools/grant.mjs "$HANDLE" "$PLAN" "$DAYS" ;;
            make-admin) node tools/admin-claim.mjs "$HANDLE" on ;;
            remove-admin) node tools/admin-claim.mjs "$HANDLE" off ;;
          esac
          rm -f "$RUNNER_TEMP/sa.json"
