name: Security

# Attack campaign against the rules and functions (Firebase emulators only, never the live project).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  attack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          (cd functions && npm ci --no-audit --no-fund)
          npm i -g firebase-tools@14
      - name: Attacks
        run: firebase emulators:exec --project acm-docs-52280 --only auth,firestore,functions "node test/attack.test.mjs" 2>&1 | tee attack.txt
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/out && cp attack.txt attack-log.json /tmp/out/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} ${GITHUB_SHA::7}" > /tmp/out/run.txt
          cd /tmp/out && git init -q -b security-results && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "security ${GITHUB_SHA::7}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" security-results
