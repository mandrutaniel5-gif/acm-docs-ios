name: Security

# Attack campaigns against the server rules and functions, on the Firebase emulators only
# (nothing is published, nothing touches the real project). Results on branch "security-results".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attacks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          (cd functions && npm ci --no-audit --no-fund)
          npm i -g firebase-tools@14.27.0
      - name: Test-only payment keys for the emulator
        run: printf 'STRIPE_SECRET_KEY=sk_test_emulator\nSTRIPE_WEBHOOK_SECRET=whsec_test_acmdocs\nMAIL_TEST=1\n' > functions/.env.local
      - name: Plans and limits (bypass attempts)
        run: firebase emulators:exec --project acm-docs-52280 --only auth,firestore,functions,storage "node test/plans.test.mjs" 2>&1 | tee plans.txt
      - name: Round 2 attacks (again)
        run: firebase emulators:exec --project acm-docs-52280 --only auth,firestore,functions "node test/attack.test.mjs" 2>&1 | tee round2.txt
      - name: Round 3 attacks
        run: firebase emulators:exec --project acm-docs-52280 --only auth,firestore,functions,storage "node test/attack3.test.mjs" 2>&1 | tee round3.txt
      - name: Dependency audit
        run: |
          (npm audit --omit=dev --json > audit-app.json || true)
          (cd functions && npm audit --omit=dev --json > ../audit-functions.json || true)
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/out && cp plans.txt round2.txt round3.txt attack-log.json attack3-log.json audit-app.json audit-functions.json /tmp/out/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} ${GITHUB_SHA::7}" > /tmp/out/run.txt
          cd /tmp/out && git init -q -b security-results && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "security ${GITHUB_SHA::7}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" security-results
