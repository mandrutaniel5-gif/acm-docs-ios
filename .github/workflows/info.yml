name: Info
# Read-only: where the database and the bucket are (results on branch "info-results").
on: workflow_dispatch
permissions:
  contents: write
jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Where
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          (cd functions && npm ci --no-audit --no-fund >/dev/null)
          NODE_PATH=functions/node_modules node --experimental-default-type=module -e "$(cat test/where.mjs)" 2>&1 | tee where.txt || true
          cp test/where.mjs functions/where.mjs && (cd functions && node where.mjs) 2>&1 | tee -a where.txt
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Publish
        if: always()
        run: |
          mkdir -p /tmp/out && cp where.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q -b info-results && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm info && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" info-results
