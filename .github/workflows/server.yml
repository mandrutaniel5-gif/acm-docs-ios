name: Server

# Cloud Functions + Firestore rules: tested against the Firebase emulators on every change,
# then published to Firebase when the deploy key is set (secret FIREBASE_SERVICE_ACCOUNT).
on:
  push:
    branches: [main]
    paths: ["functions/**", "firestore.rules", "storage.rules", "firebase.json", "test/server.test.mjs", "test/prod-smoke.mjs", "test/auth-config.mjs", ".github/workflows/server.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Firebase after the tests"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          (cd functions && npm ci --no-audit --no-fund)
          npm i -g firebase-tools@14

      - name: Test against the emulators
        run: |
          set -o pipefail
          firebase emulators:exec --project acm-docs-52280 --only auth,firestore,functions "node --test test/server.test.mjs" 2>&1 | tee server-test.txt

      - name: Publish rules and functions
        if: github.event_name == 'push' || inputs.deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "No deploy key yet (secret FIREBASE_SERVICE_ACCOUNT): tests only." | tee deploy.txt; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          # Auth first (Identity Platform, second factor, no client-side deletion): the sign-in
          # function below needs Identity Platform switched on
          node test/auth-config.mjs 2>&1 | tee deploy.txt || true
          firebase deploy --project acm-docs-52280 --only firestore:rules,firestore:indexes,functions --force --non-interactive 2>&1 | tee -a deploy.txt
          # Storage rules (only once Storage is activated in the console)
          firebase deploy --project acm-docs-52280 --only storage --non-interactive 2>&1 | tee -a deploy.txt || echo "STORAGE NOT ACTIVE" | tee -a deploy.txt
          # one real round trip with a throwaway account (created and deleted by the test)
          node test/prod-smoke.mjs 2>&1 | tee -a deploy.txt
          rm -f "$RUNNER_TEMP/sa.json"

      # results readable with plain git (branch "server-results")
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/out && cp server-test.txt deploy.txt /tmp/out/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} ${GITHUB_SHA::7}" > /tmp/out/run.txt
          cd /tmp/out && git init -q -b server-results && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "server ${GITHUB_SHA::7}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" server-results
