name: Server

# Cloud Functions + Firestore rules: tested against the Firebase emulators on every change,
# then published to Firebase when the deploy key is set (secret FIREBASE_SERVICE_ACCOUNT).
on:
  push:
    branches: [main]
    paths: ["functions/**", "site/**", "firestore.rules", "firestore.indexes.json", "storage.rules", "firebase.json", "test/server.test.mjs", "test/plans.test.mjs", "test/prod-smoke.mjs", "test/auth-config.mjs", ".github/workflows/server.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Firebase after the tests"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          (cd functions && npm ci --no-audit --no-fund)
          npm i -g firebase-tools@14.27.0

      - name: Test against the emulators
        run: |
          set -o pipefail
          # test-only payment keys for the emulator (the real ones are never in the repository)
          printf 'STRIPE_SECRET_KEY=sk_test_emulator\nSTRIPE_WEBHOOK_SECRET=whsec_test_acmdocs\nMAIL_TEST=1\n' > functions/.env.local
          firebase emulators:exec --project acm-docs-52280 --only auth,firestore,functions,storage "node --test test/server.test.mjs && node test/plans.test.mjs" 2>&1 | tee server-test.txt
          rm -f functions/.env.local

      - name: Publish rules and functions
        if: github.event_name == 'push' || inputs.deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_TAX: ${{ secrets.STRIPE_TAX }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          if [ -z "$SA" ]; then echo "No deploy key yet (secret FIREBASE_SERVICE_ACCOUNT): tests only." | tee deploy.txt; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          # payment keys (GitHub secrets STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET; optional STRIPE_TAX=1):
          # written only for the deploy, never committed
          : > functions/.env
          [ -n "$STRIPE_SECRET_KEY" ] && echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" >> functions/.env
          [ -n "$STRIPE_WEBHOOK_SECRET" ] && echo "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET" >> functions/.env
          [ -n "$STRIPE_TAX" ] && echo "STRIPE_TAX=$STRIPE_TAX" >> functions/.env
          [ -n "$SMTP_URL" ] && echo "SMTP_URL=$SMTP_URL" >> functions/.env
          [ -n "$MAIL_FROM" ] && echo "MAIL_FROM=$MAIL_FROM" >> functions/.env
          echo "payments: $([ -n "$STRIPE_SECRET_KEY" ] && echo on || echo 'off (no STRIPE_SECRET_KEY secret yet)')" | tee -a deploy.txt
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          # Auth first (Identity Platform, second factor, no client-side deletion): the sign-in
          # function below needs Identity Platform switched on
          node test/auth-config.mjs 2>&1 | tee deploy.txt || true
          firebase deploy --project acm-docs-52280 --only firestore:rules,firestore:indexes,functions --force --non-interactive 2>&1 | tee -a deploy.txt
          # the public pages (terms, privacy, payment return): acm-docs-52280.web.app, and the custom
          # domain acmdocs.acmandrut.com once it is connected in the Firebase console (Hosting)
          firebase deploy --project acm-docs-52280 --only hosting --non-interactive 2>&1 | tee -a deploy.txt || echo "HOSTING NOT DEPLOYED" | tee -a deploy.txt
          # Storage rules (only once Storage is activated in the console)
          firebase deploy --project acm-docs-52280 --only storage --non-interactive 2>&1 | tee -a deploy.txt || echo "STORAGE NOT ACTIVE" | tee -a deploy.txt
          # one real round trip with a throwaway account (created and deleted by the test)
          node test/prod-smoke.mjs 2>&1 | tee -a deploy.txt
          (cd functions && node tools/plan-key.mjs && node tools/migrate-cloud.mjs && node --env-file=.env tools/mail-test.mjs) 2>&1 | tee -a deploy.txt
          rm -f "$RUNNER_TEMP/sa.json" functions/.env

      # results readable with plain git (branch "server-results")
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/out && cp server-test.txt deploy.txt /tmp/out/ 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID} ${GITHUB_SHA::7}" > /tmp/out/run.txt
          cd /tmp/out && git init -q -b server-results && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "server ${GITHUB_SHA::7}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" server-results
